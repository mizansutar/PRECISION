<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Farming Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="title">

<h2>🌱 Smart Farming</h2>
<small>Field Status Overview</small>

</div>

</header>


<main class="container">


<!-- STATUS -->

<section class="status-grid">

<div class="status-card">
<span>Mode</span>
<h3 id="modeText">AUTO</h3>
</div>

<div class="status-card">
<span>Water Pump</span>
<h3 id="pump">OFF</h3>
</div>

</section>


<!-- SOIL MOISTURE -->

<section class="grid">

<div class="card highlight">
<span>Soil Moisture 1</span>
<h1 id="soil">0%</h1>
</div>

<div class="card highlight">
<span>Soil Moisture 2</span>
<h1 id="soil2">0%</h1>
</div>

</section>


<!-- SENSOR DATA -->

<section class="grid">

<div class="card">
<span>Air Temperature</span>
<h2 id="temp">0°C</h2>
</div>

<div class="card">
<span>Humidity</span>
<h2 id="hum">0%</h2>
</div>

<div class="card">
<span>Soil Temperature</span>
<h2 id="soilTemp">0°C</h2>
</div>

<div class="card">
<span>Gas Level</span>
<h2 id="gas">0%</h2>
</div>

<div class="card">
<span>pH Level</span>
<h2 id="ph">0</h2>
</div>

</section>


<!-- MODE CONTROL -->

<section class="card">

<span>Control Mode</span>

<div class="mode-toggle">

<button id="autoBtn" onclick="setMode('AUTO')">AUTO</button>

<button id="manualBtn" onclick="setMode('MANUAL')">MANUAL</button>

</div>

</section>


<!-- WATER PUMP -->

<section class="actions">

<button id="startBtn" class="on" onclick="pumpOn()">Start Pump</button>

<button id="stopBtn" class="off" onclick="pumpOff()">Stop Pump</button>

</section>


<!-- SPRAY MOTOR -->

<section class="card">

<span>Spray Motor</span>

<p>Status : <strong id="machineStatus">OFF</strong></p>

<div class="actions">

<button id="machineOn" class="on" onclick="machineOn()">ON</button>

<button id="machineOff" class="off" onclick="machineOff()">OFF</button>

</div>

</section>


<!-- TIME -->

<p class="timestamp">

Last updated :
<span id="time"></span>

</p>


</main>


<!-- LOADER -->

<div id="loader" class="dialog hidden">

<div class="dialog-box">

<h3 id="loaderText">Processing…</h3>

<p>Please wait <span id="loaderCount">5</span>s</p>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<!-- SCRIPT -->

<script src="script.js"></script>


</body>
</html>
